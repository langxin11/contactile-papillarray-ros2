# pre-commit 钩子 —— contactile-papillarray-ros2 包。
#
# 初始化:
#   pre-commit install --hook-type pre-commit --hook-type pre-push
#
# 设计:
#   - pre-commit: ruff check + ruff format，快速失败
#   - pre-push:   colcon test，需先在工作区根目录 colcon build

default_install_hook_types:
  - pre-commit
  - pre-push

fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types_or: [python, pyi]

      - id: colcon-test
        name: colcon test
        # 工作区脚本统一运行 Python 功能测试；PTSDK 的 CMake 风格检查单独运行。
        entry: bash -c 'ROOT="$(git rev-parse --show-toplevel)/../.."; exec "$ROOT/scripts/pre_push_test.sh"'
        language: system
        pass_filenames: false
        stages: [pre-push]
